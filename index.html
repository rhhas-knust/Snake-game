<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Game Pro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    background: #0f172a; color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .game { width: min(94vw, 450px); text-align: center; padding: 5px; }
  h1 { margin: 0 0 5px; font-size: 1.8rem; background: linear-gradient(to right, #4ade80, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
  .bar { display: flex; justify-content: space-between; margin: 0 4px 10px; font-weight: 700; font-size: 0.9rem; color: #cbd5e1; }
  .score-box { background: #1e293b; padding: 4px 10px; border-radius: 6px; border: 1px solid #334155; }
  #status { font-weight: 600; color: #38bdf8; cursor: pointer; }
  
  canvas {
    width: 100%; aspect-ratio: 1; display: block; background: #020617;
    border: 3px solid #334155; border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
  }
  
  .energy-wrap { margin: 10px 4px; text-align: left; }
  .energy-label { display: flex; justify-content: space-between; font-size: .8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
  .energy-bar { height: 12px; background: #1e293b; border-radius: 99px; overflow: hidden; border: 1px solid #334155; padding: 1px; }
  #energyFill { height: 100%; width: 100%; background: #22c55e; border-radius: 99px; transition: width .15s ease; }
  
  .legend { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-top: 10px; font-size: .75rem; color: #94a3b8; }
  .legend span { padding: 3px 7px; background: #1e293b; border: 1px solid #334155; border-radius: 999px; }
  
  .controls { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  select, button {
    padding: 8px 14px; border: 1px solid #334155; border-radius: 10px;
    font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  select { background: #1e293b; color: #fff; }
  button { background: #22c55e; color: #052e16; border: none; }
  
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 150px; margin: 15px auto 5px; }
  .dbtn {
    background: #1e293b; border: 1px solid #334155; color: #fff; 
    border-radius: 12px; height: 46px; display: flex; align-items: center; 
    justify-content: center; font-size: 1.2rem; cursor: pointer;
  }
  .dbtn:active { background: #334155; }
  .dbtn.up { grid-column: 2; }
  .dbtn.left { grid-column: 1; }
  .dbtn.down { grid-column: 2; }
  .dbtn.right { grid-column: 3; }
</style>
</head>
<body>
<div class="game">
  <h1>🐍 Snake Pro</h1>
  <div class="bar">
    <div class="score-box">Score: <span id="score">0</span></div>
    <div id="status">Playing</div>
    <div class="score-box">Best: <span id="highScore">0</span></div>
  </div>
  
  <div class="energy-wrap">
    <div class="energy-label"><span>Snake Energy</span><strong id="energyText">100%</strong></div>
    <div class="energy-bar"><div id="energyFill"></div></div>
  </div>

  <canvas id="board" width="400" height="400"></canvas>

  <div class="legend">
    <span>🍎 +15</span><span>🍌 +20</span><span>🍊 +10</span><span>🍇 +25</span>
    <span>🥭 +30</span><span>🥥 ☠</span><span>🥚 ☠</span>
  </div>

  <div class="dpad">
    <div class="dbtn up" data-dir="up">▲</div>
    <div class="dbtn left" data-dir="left">◀</div>
    <div class="dbtn down" data-dir="down">▼</div>
    <div class="dbtn right" data-dir="right">▶</div>
  </div>

  <div class="controls">
    <select id="level" aria-label="Snake game level">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
    <button id="restart">Restart</button>
  </div>
</div>

  <script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const statusEl = document.getElementById('status');
const restartBtn = document.getElementById('restart');
const levelEl = document.getElementById('level');
const energyFill = document.getElementById('energyFill');
const energyText = document.getElementById('energyText');

const cells = 20, size = canvas.width / cells;
const levels = { easy: 240, medium: 170, hard: 110, expert: 75 };

const foods = [
  {emoji:'🍎', name:'Apple', energy:15, score:10, harmful:false},
  {emoji:'🍌', name:'Banana', energy:20, score:15, harmful:false},
  {emoji:'🍊', name:'Orange', energy:10, score:8, harmful:false},
  {emoji:'🍇', name:'Grapes', energy:25, score:20, harmful:false},
  {emoji:'🥭', name:'Mango', energy:30, score:25, harmful:false},
  {emoji:'🥥', name:'Coconut', energy:0, score:0, harmful:true},
  {emoji:'🥚', name:'Boiled Egg', energy:0, score:0, harmful:true}
];

let snake, food, dir, nextDir, score, energy, gameOver, isPaused, timer;
let highScore = localStorage.getItem('snake_high_score') ? parseInt(localStorage.getItem('snake_high_score')) : 0;
highScoreEl.textContent = highScore;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  food = spawnFood();
  dir = {x:1,y:0}; nextDir = {...dir};
  score = 0; energy = 100; gameOver = false; isPaused = false;
  scoreEl.textContent = score;
  statusEl.textContent = 'Playing';
  statusEl.style.color = '#38bdf8';
  updateEnergy();
  startTimer();
  draw();
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(tick, levels[levelEl.value]);
}

function spawnFood() {
  let f;
  do {
    f = {x:Math.floor(Math.random()*cells), y:Math.floor(Math.random()*cells)};
  } while (snake && snake.some(s => s.x === f.x && s.y === f.y));

  const pool = Math.random() < 0.12
    ? foods.filter(f => f.harmful)
    : foods.filter(f => !f.harmful);

  return {...f, type:pool[Math.floor(Math.random()*pool.length)]};
}

function togglePause() {
  if (gameOver) return;
  isPaused = !isPaused;
  if (isPaused) {
    clearInterval(timer);
    statusEl.textContent = 'Paused';
    statusEl.style.color = '#f59e0b';
    draw();
  } else {
    statusEl.textContent = 'Playing';
    statusEl.style.color = '#38bdf8';
    startTimer();
  }
}

function tick() {
  if (gameOver || isPaused) return;
  dir = nextDir;
  
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

  if (head.x<0 || head.x>=cells || head.y<0 || head.y>=cells ||
      snake.some((s,i)=>i>0 && s.x===head.x && s.y===head.y)) {
    endGame('You crashed!');
    return;
  }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    const eaten = food.type;
    if (eaten.harmful) {
      endGame(`${eaten.emoji} Sick!`);
      return;
    }
    energy = Math.min(100, energy + eaten.energy);
    score += eaten.score;
    scoreEl.textContent = score;
    
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      localStorage.setItem('snake_high_score', highScore);
    }
    food = spawnFood();
  } else {
    snake.pop();
    energy = Math.max(0, energy - 0.65);
    if (energy <= 0) {
      updateEnergy();
      endGame('Out of energy!');
      return;
    }
  }

  updateEnergy();
  draw();
}

function updateEnergy() {
  const value = Math.max(0, Math.min(100, energy));
  energyText.textContent = `${Math.round(value)}%`;
  energyFill.style.width = `${value}%`;
  energyFill.style.background = value <= 20 ? '#ef4444' : value <= 45 ? '#f59e0b' : '#22c55e';
}

function endGame(message) {
  gameOver = true;
  statusEl.textContent = message;
  statusEl.style.color = '#ef4444';
  clearInterval(timer);
  draw();
}

function draw() {
  ctx.fillStyle = '#020617'; ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
  for(let i=1;i<cells;i++){ 
    ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(canvas.width,i*size);ctx.stroke(); 
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${size*.75}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  ctx.fillText(food.type.emoji, food.x*size+size/2, food.y*size+size/2+1);

  snake.forEach((s,i) => {
    const pad = i===0 ? 1 : 2;
    const x=s.x*size+pad, y=s.y*size+pad, w=size-pad*2;
    ctx.fillStyle = i===0 ? '#86efac' : '#22c55e';
    ctx.beginPath();
    ctx.roundRect(x,y,w,w,size*.3);
    ctx.fill();

    if (i===0) {
      ctx.fillStyle='#0f172a';
      const center = size / 2;
      const eyeOffset = size * 0.22;
      
      const sideX = -dir.y * eyeOffset;
      const sideY = dir.x * eyeOffset;
      
      const ex1 = s.x*size + center + dir.x*eyeOffset + sideX;
      const ey1 = s.y*size + center + dir.y*eyeOffset + sideY;
      const ex2 = s.x*size + center + dir.x*eyeOffset - sideX;
      const ey2 = s.y*size + center + dir.y*eyeOffset - sideY;
      
      ctx.beginPath(); ctx.arc(ex1,ey1,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2,ey2,2.5,0,Math.PI*2); ctx.fill();
    }
  });

  if (gameOver || isPaused) {
    ctx.fillStyle = 'rgba(2, 6, 23, 0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign='center';
    
    if(gameOver) {
      ctx.font = 'bold 28px system-ui'; ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2-15);
      ctx.font = '600 15px system-ui'; ctx.fillStyle = '#94a3b8'; ctx.fillText(statusEl.textContent, canvas.width/2, canvas.height/2+20);
    } else {
      ctx.font = 'bold 28px system-ui'; ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
    }
  }
}

function handleDirection(input) {
  if (isPaused || gameOver) return;
  if (input === 'up' && dir.y !== 1) nextDir = {x:0, y:-1};
  if (input === 'down' && dir.y !== -1) nextDir = {x:0, y:1};
  if (input === 'left' && dir.x !== 1) nextDir = {x:-1, y:0};
  if (input === 'right' && dir.x !== -1) nextDir = {x:1, y:0};
}

document.addEventListener('keydown', e => {
  const k=e.key.toLowerCase();
  if (k==='arrowup'||k==='w') handleDirection('up');
  if (k==='arrowdown'||k==='s') handleDirection('down');
  if (k==='arrowleft'||k==='a') handleDirection('left');
  if (k==='arrowright'||k==='d') handleDirection('right');
  if (k==='escape') togglePause();
  if (k===' ' && gameOver) reset();
});

document.querySelectorAll('.dbtn').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleDirection(btn.dataset.dir);
  });
});

statusEl.addEventListener('click', togglePause);
restartBtn.addEventListener('click', reset);
levelEl.addEventListener('change', reset);
reset();
</script>
</body>
</html>
